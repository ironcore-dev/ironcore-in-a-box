# Perses dashboards for the vm stack (provisioned from monitoring-ui).
# Dashboards live in the `ironcore` project and reference the provisioned
# GlobalDatasources by name (vm-metrics / vm-logs), which stacked this same
# file's sibling (perses-datasource.yaml) created.
apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-dashboards-vm
  namespace: monitoring-ui
  labels:
    ironcore.dev/observability-stack: vm
data:
  ironcore-project.yaml: |
    # Dashboards live in this project; provision it so they have a home.
    kind: Project
    metadata:
      name: ironcore
  ironcore-controllers.yaml: |
    kind: Dashboard
    metadata:
      name: ironcore-controllers
      project: ironcore
    spec:
      display:
        name: IronCore controllers
      duration: 15m
      variables:
        - kind: ListVariable
          spec:
            name: job
            display:
              name: job
              hide: false
            allowMultiple: true
            allowAllValue: true
            plugin:
              kind: PrometheusLabelValuesVariable
              spec:
                labelName: job
                datasource:
                  kind: PrometheusDatasource
                  name: vm-metrics
      panels:
        reconcileRate:
          kind: Panel
          spec:
            display:
              name: reconcile rate
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: vm-metrics
                      # per-component reconcile rate (sum over pods)
                      query: sum by (job) (rate(controller_runtime_reconcile_total{job=~"$job"}[$__rate_interval]))
        reconcileErrors:
          kind: Panel
          spec:
            display:
              name: reconcile errors
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: vm-metrics
                      query: sum by (job) (rate(controller_runtime_reconcile_errors_total{job=~"$job"}[$__rate_interval]))
        workqueueDepth:
          kind: Panel
          spec:
            display:
              name: workqueue depth
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: vm-metrics
                      query: max by (name, job) (workqueue_depth{job=~"$job"})
        goroutines:
          kind: Panel
          spec:
            display:
              name: goroutines
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: vm-metrics
                      query: go_goroutines{job=~"$job"}
        rssMemory:
          kind: Panel
          spec:
            display:
              name: RSS memory
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: bytes
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: vm-metrics
                      query: process_resident_memory_bytes{job=~"$job"}
        logs:
          kind: Panel
          spec:
            display:
              name: recent logs
            plugin:
              kind: LogsTable
              spec:
                enableDetails: true
            queries:
              - kind: LogQuery
                spec:
                  plugin:
                    kind: VictoriaLogsLogQuery
                    spec:
                      datasource:
                        kind: VictoriaLogsDatasource
                        name: vm-logs
                      # logs from all controller relabelled jobs; actual
                      # namespace/pod/container labels are attached at
                      # ingestion time and filterable here too
                      query: '_stream_source:fluent-bit-vm'
      layouts:
        - kind: Grid
          spec:
            display:
              title: Metrics
            items:
              - x: 0
                y: 0
                width: 12
                height: 8
                content:
                  $ref: '#/spec/panels/reconcileRate'
              - x: 12
                y: 0
                width: 12
                height: 8
                content:
                  $ref: '#/spec/panels/reconcileErrors'
              - x: 0
                y: 8
                width: 12
                height: 8
                content:
                  $ref: '#/spec/panels/workqueueDepth'
              - x: 12
                y: 8
                width: 12
                height: 8
                content:
                  $ref: '#/spec/panels/goroutines'
              - x: 0
                y: 16
                width: 12
                height: 8
                content:
                  $ref: '#/spec/panels/rssMemory'
        - kind: Grid
          spec:
            display:
              title: Logs
            items:
              - x: 0
                y: 0
                width: 24
                height: 10
                content:
                  $ref: '#/spec/panels/logs'

# OTel Collector for the `otel` stack.
#
# Runs as a Deployment in monitoring-otel. Scrapes the same IronCore
# controller-manager metrics endpoints (prometheus receiver) and reads
# container logs (filelog receiver). Exports to the vm stack's stores:
#   * Metrics → VMSingle via prometheusremotewrite (externalLabels: source=otel)
#   * Logs → VLSingle via loki exporter (label: _stream_source=otel-collector)
#
# This tests OTel Collector as a drop-in replacement for vmagent+fluent-bit,
# using the same underlying stores for direct comparison.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: monitoring-otel
spec:
  mode: deployment
  replicas: 1
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.127.0
  serviceAccount: otel-collector
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  volumeMounts:
    - name: varlog
      mountPath: /var/log
      readOnly: true
    - name: varlibcontainerd
      mountPath: /var/lib/containerd
      readOnly: true
  volumes:
    - name: varlog
      hostPath:
        path: /var/log
    - name: varlibcontainerd
      hostPath:
        path: /var/lib/containerd
  config:
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: ironcore-controllers-8443
              scrape_interval: 15s
              scheme: https
              tls_config:
                insecure_skip_verify: true
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names:
                      - ironcore-system
                      - ironcore-net-system
                      - apinetlet-system
                      - metalnetlet-system
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_phase]
                  regex: (Failed|Succeeded)
                  action: drop
                - source_labels: [__meta_kubernetes_pod_label_control_plane]
                  regex: controller-manager
                  action: keep
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  regex: "8443"
                  action: keep
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container

            - job_name: metalnet-28080
              scrape_interval: 15s
              scheme: https
              tls_config:
                insecure_skip_verify: true
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names:
                      - metalnet-system
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_phase]
                  regex: (Failed|Succeeded)
                  action: drop
                - source_labels: [__meta_kubernetes_pod_label_control_plane]
                  regex: controller-manager
                  action: keep
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  regex: "28080"
                  action: keep
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod

            - job_name: libvirt-provider-8080
              scrape_interval: 15s
              scheme: https
              tls_config:
                insecure_skip_verify: true
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names:
                      - libvirt-provider
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_phase]
                  regex: (Failed|Succeeded)
                  action: drop
                - source_labels: [__meta_kubernetes_pod_label_control_plane]
                  regex: controller-manager
                  action: keep
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  regex: "8080"
                  action: keep
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod

            # --- storage (only active with `make up-storage`) ---
            - job_name: ceph-volume-provider-8080
              scrape_interval: 15s
              scheme: https
              tls_config:
                insecure_skip_verify: true
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names:
                      - rook-ceph
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_phase]
                  regex: (Failed|Succeeded)
                  action: drop
                - source_labels: [__meta_kubernetes_pod_label_control_plane]
                  regex: controller-manager
                  action: keep
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  regex: "8080"
                  action: keep
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container

            - job_name: rook-ceph-mgr-9283
              scrape_interval: 15s
              scheme: http
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names:
                      - rook-ceph
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_phase]
                  regex: (Failed|Succeeded)
                  action: drop
                - source_labels: [__meta_kubernetes_pod_label_app]
                  regex: rook-ceph-mgr
                  action: keep
                - source_labels: [__meta_kubernetes_pod_label_ceph_daemon_type]
                  regex: mgr
                  action: keep
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  regex: "9283"
                  action: keep
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container

      filelog:
        include:
          - /var/log/containers/*.log
        exclude:
          - /var/log/containers/*_monitoring-otel_*.log
        start_at: beginning
        include_file_path: true
        operators:
          # Parse CRI format
          - type: regex_parser
            id: cri_parser
            regex: ^(?P<time>[^ ]+) (?P<stream>stdout|stderr) (?P<logtag>[FP]) (?P<log>.*)$
            timestamp:
              parse_from: attributes.time
              layout: "%Y-%m-%dT%H:%M:%S.%LZ"
          # Move log body (skip if CRI parse failed)
          - type: move
            from: attributes.log
            to: body
            on_error: send
          # Extract k8s metadata from file path
          - type: regex_parser
            id: filepath_parser
            parse_from: attributes["log.file.path"]
            regex: /var/log/containers/(?P<k8s_pod_name>[^_]+)_(?P<k8s_namespace_name>[^_]+)_(?P<k8s_container_name>[^-]+)-.*\.log
          # Add source label
          - type: add
            field: resource["_stream_source"]
            value: otel-collector

    processors:
      batch:
        send_batch_size: 1000
        timeout: 5s
      resource:
        attributes:
          - key: source
            value: otel
            action: upsert

    exporters:
      prometheusremotewrite:
        endpoint: http://vmsingle-vm.monitoring-vm.svc:8429/api/v1/write
        external_labels:
          source: otel
        resource_to_telemetry_conversion:
          enabled: true

      otlphttp/logs:
        endpoint: http://vlsingle-vlogs.monitoring-vm.svc:9428/insert/opentelemetry
        tls:
          insecure: true

    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [batch, resource]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [filelog]
          processors: [batch, resource]
          exporters: [otlphttp/logs]

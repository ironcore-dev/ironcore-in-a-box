# Perses dashboards for the prom stack (provisioned from monitoring-ui).
#
# Analogue of the vm stack's Perses dashboards, pinned to prom's backends:
# vm-metrics -> prom-metrics (Prometheus via Thanos query), vm-logs ->
# prom-logs (Loki). Same panels, same queries, `job` label semantics match
# since instrumentation of the targeted components is identical.
apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-dashboards-prom
  namespace: monitoring-ui
  labels:
    ironcore.dev/observability-stack: prom
data:
  ironcore-project.yaml: |
    # Dashboards live in this project; provision it so they have a home.
    kind: Project
    metadata:
      name: ironcore
  ironcore-controllers-prom.yaml: |
    kind: Dashboard
    metadata:
      name: ironcore-controllers-prom
      project: ironcore
    spec:
      display:
        name: IronCore controllers (prom)
      duration: 15m
      variables:
        - kind: ListVariable
          spec:
            name: job
            display:
              name: job
              hide: false
            allowMultiple: true
            allowAllValue: true
            plugin:
              kind: PrometheusLabelValuesVariable
              spec:
                labelName: job
                datasource:
                  kind: PrometheusDatasource
                  name: prom-metrics
      panels:
        reconcileRate:
          kind: Panel
          spec:
            display:
              name: reconcile rate
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prom-metrics
                      query: sum by (job) (rate(controller_runtime_reconcile_total{job=~"$job"}[$__rate_interval]))
        reconcileErrors:
          kind: Panel
          spec:
            display:
              name: reconcile errors
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prom-metrics
                      query: sum by (job) (rate(controller_runtime_reconcile_errors_total{job=~"$job"}[$__rate_interval]))
        workqueueDepth:
          kind: Panel
          spec:
            display:
              name: workqueue depth
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prom-metrics
                      query: max by (name, job) (workqueue_depth{job=~"$job"})
        goroutines:
          kind: Panel
          spec:
            display:
              name: goroutines
            plugin:
              kind: TimeSeriesChart
              spec: {}
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prom-metrics
                      query: go_goroutines{job=~"$job"}
        rssMemory:
          kind: Panel
          spec:
            display:
              name: RSS memory
            plugin:
              kind: TimeSeriesChart
              spec:
                yAxis:
                  format:
                    unit: bytes
            queries:
              - kind: TimeSeriesQuery
                spec:
                  plugin:
                    kind: PrometheusTimeSeriesQuery
                    spec:
                      datasource:
                        kind: PrometheusDatasource
                        name: prom-metrics
                      query: process_resident_memory_bytes{job=~"$job"}
        logs:
          kind: Panel
          spec:
            display:
              name: recent logs
            plugin:
              kind: LogsTable
              spec:
                enableDetails: true
            queries:
              - kind: LogQuery
                spec:
                  plugin:
                    kind: LokiLogQuery
                    spec:
                      datasource:
                        kind: LokiDatasource
                        name: prom-logs
                      query: '{_stream_source="fluent-bit-prom"}'
      layouts:
        - kind: Grid
          spec:
            display:
              title: Metrics
            items:
              - x: 0
                y: 0
                width: 12
                height: 8
                content:
                  $ref: '#/spec/panels/reconcileRate'
              - x: 12
                y: 0
                width: 12
                height: 8
                content:
                  $ref: '#/spec/panels/reconcileErrors'
              - x: 0
                y: 8
                width: 12
                height: 8
                content:
                  $ref: '#/spec/panels/workqueueDepth'
              - x: 12
                y: 8
                width: 12
                height: 8
                content:
                  $ref: '#/spec/panels/goroutines'
              - x: 0
                y: 16
                width: 12
                height: 8
                content:
                  $ref: '#/spec/panels/rssMemory'
        - kind: Grid
          spec:
            display:
              title: Logs
            items:
              - x: 0
                y: 0
                width: 24
                height: 10
                content:
                  $ref: '#/spec/panels/logs'

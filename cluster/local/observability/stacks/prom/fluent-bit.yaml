# fluent-bit for the `prom` stack: Deployment + ConfigMap.
#
# Single-replica Deployment (not DaemonSet) reading from the same
# /var/log/containers/*.log as the vm stack's fluent-bit. Ships to Loki
# in monitoring-prom. Uses the same parser pipeline (json_ts + logfmt_time)
# for consistent structured extraction across stacks.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring-prom
  labels:
    ironcore.dev/observability-stack: prom
data:
  fluent-bit.conf: |
    [SERVICE]
        Log_Level     info
        Log_Format    json
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            cri
        DB                /flb-state/flb-kube.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  5
        Read_from_Head    On

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           Off
        K8S-Logging.Parser  Off
        K8S-Logging.Exclude Off
        Annotations         Off
        Labels              Off

    [FILTER]
        Name          parser
        Match         kube.*
        Key_Name      log
        Parser        json_ts
        Reserve_Data  On
        Preserve_Key  Off

    [FILTER]
        Name          parser
        Match         kube.*
        Key_Name      log
        Parser        logfmt_time
        Reserve_Data  On
        Preserve_Key  Off

    [FILTER]
        Name    modify
        Match   *
        Add     _stream_source fluent-bit-prom
        Rename  msg _msg
        Rename  log _msg

    [OUTPUT]
        Name             loki
        Match            *
        Host             loki.monitoring-prom.svc.cluster.local
        Port             3100
        Labels           job=fluent-bit-prom, _stream_source=fluent-bit-prom
        Label_Keys       $stream, $kubernetes['namespace_name'], $kubernetes['pod_name'], $kubernetes['container_name']
        Auto_Kubernetes_Labels off
        Line_Format      json

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[FP]) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name        json_ts
        Format      json
        Time_Key    ts
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   Off
        Time_Strict Off

    [PARSER]
        Name        logfmt_time
        Format      logfmt
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   Off
        Time_Strict Off
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit
  namespace: monitoring-prom
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/component: log-shipper
    ironcore.dev/observability-stack: prom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
      ironcore.dev/observability-stack: prom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
        ironcore.dev/observability-stack: prom
    spec:
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 10
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.2.10
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          ports:
            - name: http
              containerPort: 2020
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibcontainerd
              mountPath: /var/lib/containerd
              readOnly: true
            - name: state
              mountPath: /flb-state
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibcontainerd
          hostPath:
            path: /var/lib/containerd
        - name: state
          emptyDir: {}
